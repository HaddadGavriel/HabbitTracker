services:
  - type: web
    name: habit-tracker-infrastructure-api
    runtime: python
    autoDeployTrigger: "off"
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: EXPO_PUSH_URL
        value: https://exp.host/--/api/v2/push/send
      - key: CORS_ORIGINS
        value: '["*"]'
  # Prepared only: a separately authorized Blueprint deployment creates/enables
  # this job. Automatic deploys remain off for both services.
  - type: cron
    name: habit-tracker-deletion-maintenance
    runtime: python
    autoDeployTrigger: "off"
    rootDir: backend
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.deletion_maintenance --limit 100 --concurrency 4 --max-seconds 240
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        fromService:
          type: web
          name: habit-tracker-infrastructure-api
          envVarKey: SUPABASE_URL
      - key: SUPABASE_PUBLISHABLE_KEY
        fromService:
          type: web
          name: habit-tracker-infrastructure-api
          envVarKey: SUPABASE_PUBLISHABLE_KEY
      - key: SUPABASE_SECRET_KEY
        fromService:
          type: web
          name: habit-tracker-infrastructure-api
          envVarKey: SUPABASE_SECRET_KEY

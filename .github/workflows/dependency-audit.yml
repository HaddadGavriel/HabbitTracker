name: Dependency advisories
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --prefix mobile --no-audit
      # Do not ignore the remaining Expo toolchain advisories or force a downgrade.
      - run: cd mobile && npm audit --json > ../npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-advisories
          path: npm-audit.json
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r backend/requirements-dev.txt --format=json --output=python-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-advisories
          path: python-audit.json
